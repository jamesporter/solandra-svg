<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Solandra SVG</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash
      // of the wrong theme. Must match the storageKey used by ThemeProvider.
      ;(function () {
        try {
          var stored = localStorage.getItem("solandra-theme")
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          document.documentElement.classList.toggle("dark", theme === "dark")
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          // Ignore: storage may be unavailable, ThemeProvider will sort it out.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
